name: tendon_loader
description: Tendon Loader is designed to measure and help cure Achille's (uh-KILL-eez) Tendon Problems.
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: ^3.10.7

dependencies:
  app_settings: ^7.0.0
  archive: ^4.0.5
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  flutter_blue: ^0.8.0
  flutter_svg: ^2.0.6
  go_router: ^17.0.0
  http: ^1.1.0
  intl: ^0.20.2
  location: ^8.0.0
  rxdart: ^0.26.0
  server:
    path: ../server
  syncfusion_flutter_charts: ^32.1.21
  syncfusion_flutter_xlsio: ^32.1.21

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
  assets:
    - assets/enable_device.webp
    - assets/enable_location.webp
    - assets/enable_bluetooth.webp
